apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: ecommerce
spec:
  selector:
    app: app
  ports:
    - name: fastcgi
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: ecommerce
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ecr-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
      initContainers:
        - name: initialize-storage
          image: YOUR_ECR_REGISTRY/laravel-app:REPLACE_WITH_COMMIT_SHA
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              if [ ! -e /uploads/.initialized ]; then
                cp -Rn /var/www/public/uploads/. /uploads/
                touch /uploads/.initialized
              fi
              mkdir -p /storage/framework/cache/data /storage/framework/sessions /storage/framework/views /storage/logs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: uploads
              mountPath: /uploads
            - name: storage
              mountPath: /storage
      containers:
        - name: app
          image: YOUR_ECR_REGISTRY/laravel-app:REPLACE_WITH_COMMIT_SHA
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: uploads
              mountPath: /var/www/public/uploads
            - name: storage
              mountPath: /var/www/storage
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
        - name: storage
          persistentVolumeClaim:
            claimName: app-storage
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
