name: Laravel CI

# Run validation for pull requests and commits targeting main.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Grant read-only repository access by default.
permissions:
  contents: read

jobs:
  # Validate Laravel, migrations, frontend assets and tests without a production database.
  laravel-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, tokenizer, pdo_sqlite, zip, gd, bcmath
          tools: composer:v2
          coverage: none

      - name: Create environment file
        run: cp .env.example .env

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate Laravel application key
        run: php artisan key:generate

      - name: Check Laravel
        run: php artisan --version

      - name: Verify migrations on an empty database
        run: php artisan migrate --force --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: php vendor/bin/phpunit

      - name: Security audit Composer dependencies
        run: composer audit

  # Scan the clean checkout for dependency vulnerabilities, secrets and misconfigurations.
  trivy:
    name: Trivy security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Scan dependencies, secrets and misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          severity: "HIGH,CRITICAL"
          format: "table"
          exit-code: "1"
          timeout: "10m"
          version: "v0.75.0"

  # Analyze source code with security and PHP rules; findings fail this job.
  semgrep:
    name: Semgrep code scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Scan source code
        run: >-
          semgrep scan
          --config p/security-audit
          --config p/php
          --error
          --metrics=off
          --disable-version-check
          .

  # Build and publish the app and web images after all validation jobs succeed.
  build-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [laravel-ci, trivy, semgrep]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Authenticate to AWS using the GitHub OIDC provider and a role that allows ECR access.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build the PHP runtime target and identify the release by its commit SHA.
      - name: Build Laravel image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --target runtime \
            -t "$ECR_REGISTRY/laravel-app:$IMAGE_TAG" \
            .

      # Build the Nginx target from the same commit, including compiled frontend assets.
      - name: Build Nginx image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --target web \
            -t "$ECR_REGISTRY/laravel-web:$IMAGE_TAG" \
            .

      # Scan both locally built images before either image is published.
      - name: Scan Laravel image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: ${{ steps.login-ecr.outputs.registry }}/laravel-app:${{ github.sha }}
          scanners: "vuln,secret"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          format: "table"
          exit-code: "1"
          timeout: "10m"
          version: "v0.75.0"

      - name: Scan Nginx image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: ${{ steps.login-ecr.outputs.registry }}/laravel-web:${{ github.sha }}
          scanners: "vuln,secret"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          format: "table"
          exit-code: "1"
          timeout: "10m"
          version: "v0.75.0"

      # Publish SHA-tagged images to existing ECR repositories.
      - name: Push Laravel image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$ECR_REGISTRY/laravel-app:$IMAGE_TAG"

      - name: Push Nginx image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$ECR_REGISTRY/laravel-web:$IMAGE_TAG"
