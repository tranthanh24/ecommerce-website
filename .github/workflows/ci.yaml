name: Laravel CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  laravel-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, tokenizer, pdo_sqlite, zip, gd, bcmath
          tools: composer:v2
          coverage: none

      - name: Create environment file
        run: cp .env.example .env

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate Laravel application key
        run: php artisan key:generate

      - name: Check Laravel
        run: php artisan --version

      - name: Verify migrations on an empty database
        run: php artisan migrate --force --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: php vendor/bin/phpunit

      - name: Security audit Composer dependencies
        run: composer audit

  trivy:
    name: Trivy security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Scan dependencies, secrets and misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          severity: "HIGH,CRITICAL"
          format: "table"
          exit-code: "1"
          timeout: "10m"

  semgrep:
    name: Semgrep code scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.177.0
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Scan source code
        run: >-
          semgrep scan
          --config p/security-audit
          --config p/php
          --error
          --metrics=off
          --disable-version-check
          .
